.dex{font-size:13px;margin-top:10px;text-align:center;max-width:480px}

// ---- world zones ----
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function zname(){return ZN[Math.abs(zx*5+zy*3)%6]}
function gen(){const R=rng(zx*73856093^zy*19349663^777),bi=Math.abs(zx*5+zy*3)%6,dens=[.46,.3,.55,.4,.5,.2][bi],wat=[.08,.2,.04,.06,.16,.04][bi],tre=[.08,.1,.2,.05,.1,.25][bi];
map=[];rnd=[];for(let y=0;y<H;y++){map[y]=[];rnd[y]=[];for(let x=0;x<W;x++){rnd[y][x]=R();const r=R();map[y][x]=r<dens?1:r<dens+wat?3:r<dens+wat+tre?2:0}}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){if((x==0||y==0||x==W-1||y==H-1)&&(map[y][x]==2||map[y][x]==3))map[y][x]=0}
for(let x=0;x<W;x++)map[5][x]=4;for(let y=0;y<H;y++)map[y][7]=4;

npcs=[];if(zx||zy){const nn=(R()<.55?1:0)+(R()<.3?1:0);for(let i=0;i<nn;i++){let x,y,c=0;do{x=1+Math.floor(R()*(W-2));y=1+Math.floor(R()*(H-2));c++}while((map[y][x]==2||map[y][x]==3)&&c<40);const k=zx+","+zy+","+i,tm=[Math.floor(R()*12),Math.floor(R()*12)].slice(0,1+(R()<.5?1:0));if(!beaten[k])npcs.push({x,y,hx:x,hy:y,ax:x,ay:y,k,t:30,team:tm})}}
if(!opened[zx+","+zy]&&R()<.7){let cx,cy;do{cx=1+Math.floor(R()*(W-2));cy=1+Math.floor(R()*(H-2))}while(map[cy][cx]==4||(!zx&&!zy&&cx<4&&cy<4));map[cy][cx]=5}}
function zone(dx,dy){zx+=dx;zy+=dy;P.x=dx>0?0:dx<0?W-1:P.x;P.y=dy>0?0:dy<0?H-1:P.y;P.ax=P.x;P.ay=P.y;gen();zoneT=120;pend=false}

const GR=["#7dbb62","#74b25a","#80c066"];
function tile2(x,y,t){const px=x*T,py=y*T,c=map[y][x],r=rnd[y][x];
g.fillStyle=c==4?(r<.5?"#cfae73":"#c7a569"):GR[Math.floor(r*3)];g.fillRect(px,py,T,T);

if(r>.86){g.fillStyle=r>.93?"#ffd84d":"#ff8fb1";g.fillRect(px+10,py+12,4,4);g.fillStyle="#fff";g.fillRect(px+11,py+13,2,2)}

for(let i=0;i<6;i++){const bx=px+2+i*5.5,sw=Math.sin(t/350+x*1.3+i)*2.5,hh=10+((i*7+x*3)%7);g.strokeStyle=i%2?"#58b04f":"#3f9a45";g.lineWidth=2.5;g.beginPath();g.moveTo(bx,py+T-2);g.quadraticCurveTo(bx,py+T-hh/2,bx+sw,py+T-hh-6);g.stroke()}}
if(c==3){const gr=g.createLinearGradient(0,py,0,py+T);gr.addColorStop(0,"#5aa7d6");gr.addColorStop(1,"#3a82b8");g.fillStyle=gr;g.fillRect(px,py,T,T);

ell(px+16,py+10,15,13,"#1f6a30");ell(px+12,py+8,11,9,"#2f8a3e");ell(px+10,py+5,6,4,"#4cae52")}}

function ballArt(x,y,r,k,t,c){c=c||g;const C=[["#6fe0c4","#1d8f7a"],["#e3e9f1","#6d7d92"],["#ffe27a","#c98a00"]][k];

c.fillStyle="#232634";c.fillRect(x-r,y-r*.12,2*r,r*.24);c.restore();

// ---- poachers ----
function npcUpdate(){for(const n of npcs){const dx=n.x-n.ax,dy=n.y-n.ay;if(Math.abs(dx)>.02||Math.abs(dy)>.02){n.ax+=Math.sign(dx)*Math.min(.05,Math.abs(dx));n.ay+=Math.sign(dy)*Math.min(.05,Math.abs(dy));n.st=(n.st||0)+.3}else{n.ax=n.x;n.ay=n.y;n.st=0;
if(mode=="map"&&!pend&&Math.abs(n.x-P.x)+Math.abs(n.y-P.y)<=1&&Math.abs(P.ax-P.x)<.02&&Math.abs(P.ay-P.y)<.02){startT(n);return}
if(--n.t<=0){n.t=60+Math.floor(Math.random()*80);const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)],x=n.x+d[0],y=n.y+d[1];if(x>=0&&y>=0&&x<W&&y<H&&Math.abs(x-n.hx)+Math.abs(y-n.hy)<=3&&map[y][x]!=2&&map[y][x]!=3&&map[y][x]!=5&&!(x==P.x&&y==P.y)&&!npcs.some(o=>o!==n&&o.x==x&&o.y==y)){n.x=x;n.y=y}}}}}
function drawNpc(x,y,st){ell(x,y,9,4,"#0004");const l=Math.sin(st)*3;g.fillStyle="#1b1b26";g.fillRect(x-6,y-9,5,9+l);g.fillRect(x+1,y-9,5,9-l);g.fillStyle="#2b2b3a";g.fillRect(x-7,y-21,14,13);g.fillStyle="#c0392b";g.fillRect(x-2,y-18,4,5);g.fillStyle="#f1c9a0";g.beginPath();g.arc(x,y-26,7,0,7);g.fill();g.fillStyle="#111";g.fillRect(x-8,y-34,16,6);g.fillRect(x-6,y-27,12,3);g.fillStyle="#ffd23f";g.font="bold 14px system-ui";g.textAlign="center";g.fillText("!",x,y-38);g.textAlign="left"}
function startT(n){trn={npc:n,k:n.k,q:[...n.team]};mode="battle";held=null;pend=false;$("bt").style.display="block";$("pad").style.display="none";nextT()}
function nextT(){const si=trn.q.shift(),s=SP[si],ri=Math.random()<.3?1:0,rar=RAR[ri],mh=Math.round(s.max*rar.hp);foe={...s,rar,ri,si,sh:0,max:mh,hp:mh,atk:Math.round(s.atk*rar.atk),trainer:1};fx.fade=1;fx.ball=null;fx.ban=0;log(`A Poacher sends out ${rar.n} ${s.n}!`);btns(true)}
function winT(){beaten[trn.k]=1;npcs=npcs.filter(n=>n!==trn.npc);P.cages+=3;const lk=Object.keys(WP).filter(k=>!P.wp[k]&&WP[k].src=="p");let m=" The Poacher flees! +3 cages.";if(lk.length&&Math.random()<.6){const k=lk[Math.floor(Math.random()*lk.length)];P.wp[k]=1;m+=` Got a ${WP[k].n}!`}return m+drop(.7)}

function row(ic,html,btn){const d=document.createElement("div");d.className="pc";if(typeof ic=="string"){const s=document.createElement("span");s.style.fontSize="26px";s.textContent=ic;d.appendChild(s)}else d.appendChild(ic);const t=document.createElement("span");t.innerHTML=html;d.appendChild(t);if(btn)d.appendChild(btn);return d}
function equip(k){P.w=k;P.ammo=WP[k].mag;if(mode=="battle"&&foe){toggleInv();btns(false);log("Switched to "+WP[k].n+".");foeTurn("Switched to "+WP[k].n+".")}else renderInv();hud()}

function btns(on){["b1","b2","b3","b4","b5","b6","b7"].forEach(i=>$(i).disabled=!on);$("b9").disabled=!on||!P.allies.some(q=>q.hp>0);$("b9").textContent="🐾 Team attack ("+P.allies.filter(q=>q.hp>0).length+")";$("b8").disabled=!on||P.allies.length>=3||!P.party.some(p=>p.hp>0&&!P.allies.includes(p));$("b2").textContent="🕸️ Cage x"+P.cages;$("b6").textContent="⚙️ Steel x"+P.steel;$("b7").textContent="✨ Master Cage ∞";$("b5").textContent="🩹 Medkit x"+(P.infH?"∞":P.kits)}
function start(f){trn=null;const zb=Math.abs(zx*5+zy*3)%6,pf=PREF[zb],s=SP[Math.random()<.5?pf[Math.floor(Math.random()*pf.length)]:Math.floor(Math.random()*SP.length)];let r=Math.random()*100,ri=0;for(;ri<3;ri++){r-=RAR[ri].w;if(r<0)break}if(f)ri=f;const rar=RAR[ri],mh=Math.round(s.max*rar.hp);foe={...s,rar,ri,si:SP.indexOf(s),max:mh,hp:mh,atk:Math.round(s.atk*rar.atk),sh:Math.random()<.05?1:0};(P.dx[foe.si]=P.dx[foe.si]||{c:0,sh:0,b:0}).s=1;fx.fade=1;fx.ball=null;fx.ban=110;mode="battle";held=null;

async function endB(msg){if(trn&&trn.q.length){log(msg);btns(false);await sleep(1100);nextT();return}if(trn){msg+=winT();trn=null}log(msg);btns(false);await sleep(1400);P.party.forEach(p=>p.hp=p.max);P.allies=[];$("party").style.display="none";foe=null;mode="map";$("bt").style.display="none";$("pad").style.display="grid";hud()}
async function foeTurn(pre){await sleep(500);if(foe.stun){foe.stun=0;log(pre+" "+foe.n+" is stunned and can't move!");btns(true);return}for(let i=0;i<8;i++){fx.lunge=Math.sin(i/7*Math.PI)*60;await sleep(25)}fx.lunge=0;
const al2=P.allies.filter(q=>q.hp>0),tg=al2.length&&Math.random()<al2.length/(al2.length+1)?al2[Math.floor(Math.random()*al2.length)]:null;if(Math.random()<.75){const d=foe.atk+Math.floor(Math.random()*4);if(tg){tg.hp=Math.max(0,tg.hp-d);fx.ash=14;fx.ahi=P.allies.indexOf(tg);log(`${pre} ${foe.n} hits ${SP[tg.si].n} for ${d}!`+(tg.hp<1?" It fainted!":""))}else{P.hp-=d;fx.pshake=14;log(`${pre} ${foe.n} hits you for ${d}!`)}}else log(`${pre} ${foe.n} missed.`);
if(P.hp<=0){P.hp=30;P.cages=Math.max(3,P.cages);P.x=P.ax=1;P.y=P.ay=1;trn=null;await endB("You blacked out and woke up at camp.");return}
btns(true)}
function drop(c){if(foe&&foe.ri==3&&!P.wp.sniper){P.wp.sniper=1;return" LEGENDARY DROP: Sniper!"}if(Math.random()>c)return"";const r=Math.random();if(Math.random()<.2){const lk=Object.keys(WP).filter(k=>!P.wp[k]&&WP[k].src=="c");if(lk.length){const k=lk[Math.floor(Math.random()*lk.length)];P.wp[k]=1;return` Found a ${WP[k].n}! (open Bag)`}}if(r<.35){P.mags++;return" Found a spare mag."}if(r<.65){P.kits++;return" Found a medkit!"}if(r<.9){P.cages+=2;return" Found 2 cages."}if(r<.98){P.steel++;return" Found a Steel Cage!"}P.gold++;return" Found a MASTER cage!!"}
async function ko(){P.ko++;const m=`${foe.rar.n} ${foe.n} is knocked out!`+drop(.45+foe.ri*.15);for(let i=0;i<20;i++){fx.fade-=.05;await sleep(30)}endB(m)}
async function act(a){if(!foe||mode!="battle")return;btns(false);let pre="";
if(a=="shoot"){if(!P.inf&&P.ammo<1){log("Click! Magazine empty. Reload!");btns(true);return}
if(!P.inf)P.ammo--;fx.flash=6;await sleep(120);
const wq=WP[P.w];let tot=0,hits=0;for(let k=0;k<wq.sh;k++){if(Math.random()<wq.acc){hits++;tot+=wq.min+Math.floor(Math.random()*(wq.max-wq.min+1))}}foe.hp=Math.max(0,foe.hp-tot);if(hits){fx.hit=8;fx.shake=14}pre=hits?`${wq.snd} ${tot} damage${wq.sh>1?" ("+hits+"/"+wq.sh+" hit)":""}.`:`${wq.snd} Missed.`;if(hits&&wq.stun&&Math.random()<wq.stun){foe.stun=1;pre+=" It's stunned!"};
log(pre);await sleep(350);
if(foe.hp<=0){P.ko++;let m=`${foe.rar.n} ${foe.n} is knocked out!`;m+=drop(.45+foe.ri*.15);
for(let i=0;i<20;i++){fx.fade-=.05;await sleep(30)}endB(m);return}
foeTurn(pre)}
else if(a=="reload"){if(P.mags<1){log("No spare mags.");btns(true);return}P.mags--;P.ammo=WP[P.w].mag;log("Reloaded.");foeTurn("Reloaded.")}
else if(a=="ally"){for(let i=0;i<P.allies.length;i++){const al=P.allies[i];if(al.hp<1)continue;const sp=SP[al.si],d=Math.round(sp.atk*RAR[al.ri].atk*1.6)+Math.floor(Math.random()*5);fx.ai=i;for(let k=0;k<10;k++){fx.al=Math.sin(k/9*Math.PI)*90;await sleep(22)}fx.al=0;foe.hp=Math.max(0,foe.hp-d);fx.hit=8;fx.shake=14;if(al.si==10&&Math.random()<.4)foe.stun=1;if(al.si==7)P.hp=Math.min(30,P.hp+5);log(`${sp.n} used ${MV[al.si]} for ${d}!`);await sleep(300);if(foe.hp<=0){ko();return}}foeTurn("Team attack!")}
else if(a=="kit"){if((!P.infH&&P.kits<1)||P.hp>=30){log(P.hp>=30?"You're at full health.":"No medkits.");btns(true);return}if(!P.infH)P.kits--;const h=Math.min(30-P.hp,15);P.hp+=h;log(`Used a medkit: +${h} HP.`);foeTurn(`+${h} HP.`)}
else if(a=="cage"||a=="steel"||a=="gold"){if(foe.trainer){log("You can't catch another hunter's critter!");btns(true);return}const B={cage:["cages",1,"#ddd","Cage"],steel:["steel",1.7,"#8aa4c8","Steel Cage"],gold:["gold",99,"#f5c542","Master Cage"]}[a];if(a!="gold"&&P[B[0]]<1){log("None left!");btns(true);return}if(a!="gold")P[B[0]]--;
for(let i=0;i<=20;i++){const u=i/20;fx.ball={x:190+160*u,y:215-80*Math.sin(u*Math.PI)-35*u,col:B[2],k:a=="cage"?0:a=="steel"?1:2};await sleep(20)}
fx.fade=0;fx.ball={x:350,y:150,col:B[2],k:a=="cage"?0:a=="steel"?1:2};for(let i=0;i<3;i++){fx.ball.x=350-8;await sleep(180);fx.ball.x=350+8;await sleep(180)}fx.ball.x=350;
const c=Math.min(1,Math.max(.04,(.25+(1-foe.hp/foe.max)*.6)*B[1]/foe.rar.d));
if(Math.random()<c){const key=foe.rar.n+" "+foe.n;P.caught[key]=(P.caught[key]||0)+1;P.party.push({si:foe.si,ri:foe.ri,sh:foe.sh,max:foe.max,hp:foe.max});const dd=P.dx[foe.si];dd.c++;dd.b=Math.max(dd.b,foe.ri);if(foe.sh)dd.sh=1;endB(`Gotcha! ${foe.rar.n} ${foe.n} caught with ${B[3]}!`)}else{fx.ball=null;fx.fade=1;foeTurn("It broke free!")}}
else{if(foe.trainer){log("You can't run from a Poacher!");btns(true);return}if(Math.random()<.6)endB("Got away safely.");else foeTurn("Couldn't escape!")}}
hud();requestAnimationFrame(frame);
